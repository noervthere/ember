<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- M3 Dark Color Palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141218" />
      <stop offset="100%" stop-color="#0F0D13" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="28" fill="url(#bgGrad)" />

  <!-- Stacked Digital Time: "10" on top, "45" below -->
  <g transform="translate(150, 105)">
    <!-- Hours (onSurface #E6E0E9) -->
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="106" font-weight="900" letter-spacing="-3" fill="#E6E0E9" text-anchor="middle" dominant-baseline="middle">10</text>
  </g>

  <g transform="translate(150, 200)">
    <!-- Minutes (primary #D0BCFF) -->
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="106" font-weight="900" letter-spacing="-3" fill="#D0BCFF" text-anchor="middle" dominant-baseline="middle">45</text>
  </g>

  <!-- Date Pill (primaryContainer #4F378B with onPrimaryContainer #EADDFF text) -->
  <g transform="translate(150, 255)">
    <rect x="-65" y="-17" width="130" height="34" rx="17" fill="#4F378B" />
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#EADDFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.3">Mon, Jul 20</text>
  </g>
</svg>
