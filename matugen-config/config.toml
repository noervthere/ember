[templates.ambxst]
input_path = "/nix/store/mmszijbflrikhqx010jnc6aifcb4ys3a-ambxst-shell-1.1.5/assets/matugen/colors.json"
output_path = "~/.cache/ambxst/colors.json"
post_hook = "pywalfox update"
[config.custom_colors.red]
color = "#FF0000"
blend = true

[config.custom_colors.green]
color = "#00FF00"
blend = true

[config.custom_colors.yellow]
color = "#FFFF00"
blend = true

[config.custom_colors.blue]
color = "#0000FF"
blend = true

[config.custom_colors.magenta]
color = "#FF00FF"
blend = true

[config.custom_colors.cyan]
color = "#00FFFF"
blend = true

[config.custom_colors.white]
color = "#FFFFFF"
blend = true

[templates.alacritty]
input_path = '/home/ovt/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/colors.toml'

[templates.qt5ct]
input_path = '/home/ovt/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '/home/ovt/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.gtk4]
input_path = '/home/ovt/.config/matugen/templates/gtk.css'
output_path = '/home/ovt/.config/gtk-4.0/gtk.css'
post_hook = "nautilus -q"

[templates.gtk41]
input_path = '/home/ovt/.config/matugen/templates/gtk.css'
output_path = '/home/ovt/.config/gtk-4.0/colors.css'
post_hook = "/run/current-system/sw/bin/nautilus -q"

[templates.kvantum_kvconfig]
input_path = './templates/kvantum-colors.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = './templates/kvantum-colors.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'

[templates.ember_clock]
input_path  = "./templates/colors.css"
output_path = "/home/ovt/Projects/ember/colors.json"