<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141218" />
      <stop offset="100%" stop-color="#0F0D13" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="320" rx="28" fill="url(#bgGrad)" />

  <g transform="translate(15, 15)">
    <!-- Local Clock Card (primaryContainer #4F378B) -->
    <rect width="270" height="88" rx="24" fill="#4F378B" />
    <text x="20" y="26" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#EADDFF" opacity="0.65" letter-spacing="1.5">LOCAL TIME</text>
    <text x="20" y="62" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="bold" fill="#EADDFF" letter-spacing="-0.5">10:45 PM</text>
    <text x="250" y="58" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="medium" fill="#EADDFF" opacity="0.8" text-anchor="end">Mon, Jul 20</text>

    <!-- Zone Card 1: New York (surfaceContainer #211F26) -->
    <g transform="translate(0, 98)">
      <rect width="270" height="64" rx="16" fill="#211F26" />
      <text x="18" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="semibold" fill="#E6E0E9">New York</text>
      <text x="18" y="46" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="medium" fill="#CAC4D0" opacity="0.8">Today, -10h ☀️</text>
      <text x="252" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#E6E0E9" text-anchor="end">12:45 PM</text>
    </g>

    <!-- Zone Card 2: London (surfaceContainer #211F26) -->
    <g transform="translate(0, 172)">
      <rect width="270" height="64" rx="16" fill="#211F26" />
      <text x="18" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="semibold" fill="#E6E0E9">London</text>
      <text x="18" y="46" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="medium" fill="#CAC4D0" opacity="0.8">Today, -5h ☀️</text>
      <text x="252" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#E6E0E9" text-anchor="end">5:45 PM</text>
    </g>

    <!-- Zone Card 3: Tokyo (surfaceContainer #211F26) -->
    <g transform="translate(0, 246)">
      <rect width="270" height="64" rx="16" fill="#211F26" />
      <text x="18" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="semibold" fill="#E6E0E9">Tokyo</text>
      <text x="18" y="46" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="medium" fill="#CAC4D0" opacity="0.8">Tomorrow, +3.5h 🌙</text>
      <text x="252" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#E6E0E9" text-anchor="end">2:15 AM</text>
    </g>
  </g>
</svg>
